    <!-- MUST stay the first script: "ResizeObserver loop completed with
         undelivered notifications" is benign browser noise, but it fires as a
         window error event with NO Error object, so dev tooling (the vite
         error overlay, the preview log bridge) misreports it as a runtime
         crash. This classic inline script runs during parse — before any
         module script can register listeners — so its suppressor always wins.
         It also wraps ResizeObserver callbacks in requestAnimationFrame so the
         browser never generates the notification in the first place. -->
    <script>
      (function () {
        var RO_RE = /ResizeObserver loop (completed with undelivered notifications|limit exceeded)/;
        window.addEventListener(
          "error",
          function (e) {
            if (e.message && RO_RE.test(e.message)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
        if (typeof window.ResizeObserver === "function") {
          var NativeRO = window.ResizeObserver;
          var PatchedRO = function (callback) {
            var raf = null;
            var pending = new Map();
            return new NativeRO(function (entries, observer) {
              for (var i = 0; i < entries.length; i++) {
                pending.set(entries[i].target, entries[i]);
              }
              if (raf !== null) return;
              raf = requestAnimationFrame(function () {
                raf = null;
                var list = Array.from(pending.values());
                pending.clear();
                callback(list, observer);
              });
            });
          };
          PatchedRO.prototype = NativeRO.prototype;
          window.ResizeObserver = PatchedRO;
        }
      })();
    </script>
    <!-- Apply the saved theme before first paint so the splash never flashes the
         wrong background. Dark is the default; the Settings → Appearance toggle
         switches to light, persisted in localStorage under "theme". -->
    <script>
      (function () {
        try {
          var light = localStorage.getItem("theme") === "light";
          var el = document.documentElement;
          el.classList.toggle("dark", !light);
          var bg = light ? "#ffffff" : "#050505";
          el.style.backgroundColor = bg;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", bg);
        } catch (e) {}
      })();
    </script>

  <body>
    <!-- Boot splash: painted straight from HTML so the trampoline bounce starts
         the moment the page renders — long before the React bundle downloads
         and boots (on a cold PWA launch the static iOS launch image used to sit
         frozen for ~1s while the app loaded). Styles are self-contained because
         index.css is not loaded yet at this point. React's <SplashScreen> does
         NOT render its own copy — it only times the fade-out and removes this
         node, so it is the same DOM the whole time and there is no handoff snap
         mid-bounce.
         Loading phase (user request): the /splash/launch-*.png images are now
         PLAIN solid dark (#050505) and this overlay first shows only a spinner
         (#boot-splash-loader); the icon+title content stays hidden until the
         icon image and the display fonts are actually loaded (inline script
         adds .ready, 2.5s safety timeout). Black + loading circle on every
         device until the real splash can render — no static/live content
         matching, so there is nothing to visually "stick" or jump. -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(ellipse 70% 45% at 15% -5%,hsl(199 95.5% 73.9% / .07) 0%,transparent 60%),
                   radial-gradient(ellipse 50% 40% at 90% 0%,hsl(234 89.5% 73.9% / .05) 0%,transparent 55%),
                   hsl(0 0% 2%)}
      html:not(.dark) #boot-splash{
        background:radial-gradient(ellipse 70% 45% at 15% -5%,hsl(200 98% 39.4% / .10) 0%,transparent 60%),
                   radial-gradient(ellipse 50% 40% at 90% 0%,hsl(239 83.5% 66.7% / .07) 0%,transparent 55%),
                   hsl(0 0% 100%)}
      #boot-splash-loader{position:absolute;left:50%;top:50%;width:2.25rem;height:2.25rem;margin:-1.125rem 0 0 -1.125rem;
        border-radius:9999px;border:3px solid hsl(199 95.5% 73.9% / .2);border-top-color:hsl(199 95.5% 73.9%);
        animation:boot-spin .8s linear infinite}
      html:not(.dark) #boot-splash-loader{border-color:hsl(200 98% 39.4% / .2);border-top-color:hsl(200 98% 39.4%)}
      #boot-splash.ready #boot-splash-loader{display:none}
      #boot-splash-group{display:flex;flex-direction:column;align-items:center;gap:1.75rem;visibility:hidden}
      #boot-splash.ready #boot-splash-group{visibility:visible;animation:boot-fade-in-up .4s ease-out}
      #boot-splash-icon{width:6rem;height:6rem;border-radius:1.5rem;-webkit-user-select:none;user-select:none;
        box-shadow:0 0 0 1px hsl(0 0% 100% / .1),0 25px 50px -12px hsl(199 95.5% 73.9% / .25);
        animation:boot-splash-bounce .95s infinite;transform-origin:center bottom}
      html:not(.dark) #boot-splash-icon{box-shadow:0 0 0 1px hsl(0 0% 0% / .05),0 25px 50px -12px hsl(200 98% 39.4% / .25)}
      #boot-splash-text{display:flex;flex-direction:column;align-items:center;gap:.625rem}
      #boot-splash-title{margin:0;font-family:'Inter',sans-serif;font-weight:800;font-size:2.6rem;line-height:1.02;
        letter-spacing:-0.03em;color:hsl(180 6.7% 97.1%)}
      html:not(.dark) #boot-splash-title{color:hsl(210 33.3% 5.9%)}
      #boot-splash-title span{color:hsl(199 95.5% 73.9%)}
      html:not(.dark) #boot-splash-title span{color:hsl(200 98% 39.4%)}
      #boot-splash-tagline{margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;font-weight:500;
        letter-spacing:.18em;text-transform:uppercase;color:hsl(216 6.9% 57.5% / .8);
        font-feature-settings:"liga" 0,"calt" 0;font-variant-ligatures:none}
      html:not(.dark) #boot-splash-tagline{color:hsl(211 11.1% 44.1% / .8)}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-fade-in-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      @keyframes boot-splash-bounce{
        0%,100%{transform:translateY(0) scaleX(1) scaleY(1);animation-timing-function:cubic-bezier(.33,0,.4,1)}
        45%{transform:translateY(-26px) scaleX(.97) scaleY(1.03);animation-timing-function:cubic-bezier(.6,0,.67,1)}
        90%{transform:translateY(0) scaleX(1.05) scaleY(.95)}}
      @media (prefers-reduced-motion:reduce){#boot-splash-icon{animation:none}#boot-splash.ready #boot-splash-group{animation:none}}
    </style>
    <div id="boot-splash" data-testid="splash-screen" aria-hidden="true">
      <div id="boot-splash-loader"></div>
      <div id="boot-splash-group">
        <img id="boot-splash-icon" src="/icon-512.png" alt="" draggable="false" />
        <div id="boot-splash-text">
          <h1 id="boot-splash-title">Trampoline <span>Note</span></h1>
          <p id="boot-splash-tagline">Jump · Log · Progress</p>
        </div>
      </div>
    </div>
    <!-- Splash loading gate, runs during parse (all devices): keep the spinner
         until the icon image AND the display fonts are actually loaded, then
         add .ready to swap spinner → animated splash content. 2.5s safety
         timeout so a stalled asset can never hold the spinner forever, and a
         15s dead-man fade in case the app bundle itself never boots. -->
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        var icon = document.getElementById("boot-splash-icon");
        if (!splash || !icon) return;
        var revealed = false;
        function reveal() {
          if (revealed) return;
          revealed = true;
          splash.classList.add("ready");
        }
        var iconDone = icon.complete && icon.naturalWidth > 0;
        var fontsDone = false;
        function check() { if (iconDone && fontsDone) reveal(); }
        if (!iconDone) {
          var onIcon = function () { iconDone = true; check(); };
          icon.addEventListener("load", onIcon);
          icon.addEventListener("error", onIcon);
        }
        if (document.fonts && document.fonts.load) {
          var fontsOk = function () { fontsDone = true; check(); };
          Promise.all([
            document.fonts.load("800 1em 'Inter'"),
            document.fonts.load("500 1em 'IBM Plex Mono'"),
          ]).then(fontsOk, fontsOk);
        } else {
          fontsDone = true;
        }
        check();
        setTimeout(reveal, 2500);
        // Dead-man fallback: if the app bundle never boots (network failure,
        // crash before mount), don't spin/bounce forever — self-fade after 15s.
        // Harmless no-op when React has already removed the node.
        setTimeout(function () {
          if (!document.getElementById("boot-splash")) return;
          splash.style.transition = "opacity .5s ease-out";
          splash.style.opacity = "0";
          splash.style.pointerEvents = "none";
          setTimeout(function () { splash.remove(); }, 500);
        }, 15000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
