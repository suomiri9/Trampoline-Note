<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trampoline Note</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 24px; box-sizing: border-box; text-align: center;
        font-family: -apple-system, system-ui, sans-serif; background: #2563eb; color: #fff;
      }
      h1 { font-size: 22px; margin: 0; }
      p { margin: 0; opacity: 0.85; max-width: 280px; line-height: 1.4; }
      button {
        margin-top: 12px; padding: 12px 28px; border: 0; border-radius: 12px;
        font-size: 16px; font-weight: 600; background: #fff; color: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>Trampoline Note needs an internet connection. Check your connection and try again.</p>
    <button onclick="location.href='https://trampolinenote.com/'">Try again</button>
  </body>
</html>
