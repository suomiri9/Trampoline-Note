    <!-- MUST stay the first script: "ResizeObserver loop completed with
         undelivered notifications" is benign browser noise, but it fires as a
         window error event with NO Error object, so dev tooling (the vite
         error overlay, the preview log bridge) misreports it as a runtime
         crash. This classic inline script runs during parse — before any
         module script can register listeners — so its suppressor always wins.
         It also wraps ResizeObserver callbacks in requestAnimationFrame so the
         browser never generates the notification in the first place. -->
    <script>
      (function () {
        var RO_RE = /ResizeObserver loop (completed with undelivered notifications|limit exceeded)/;
        window.addEventListener(
          "error",
          function (e) {
            if (e.message && RO_RE.test(e.message)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
        if (typeof window.ResizeObserver === "function") {
          var NativeRO = window.ResizeObserver;
          var PatchedRO = function (callback) {
            var raf = null;
            var pending = new Map();
            return new NativeRO(function (entries, observer) {
              for (var i = 0; i < entries.length; i++) {
                pending.set(entries[i].target, entries[i]);
              }
              if (raf !== null) return;
              raf = requestAnimationFrame(function () {
                raf = null;
                var list = Array.from(pending.values());
                pending.clear();
                callback(list, observer);
              });
            });
          };
          PatchedRO.prototype = NativeRO.prototype;
          window.ResizeObserver = PatchedRO;
        }
      })();
    </script>
    <!-- Apply the saved theme before first paint so the splash never flashes the
         wrong background. Dark is the default; the Settings → Appearance toggle
         switches to light, persisted in localStorage under "theme". -->
    <script>
      (function () {
        try {
          var light = localStorage.getItem("theme") === "light";
          var el = document.documentElement;
          el.classList.toggle("dark", !light);
          var bg = light ? "#ffffff" : "#050505";
          el.style.backgroundColor = bg;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", bg);
        } catch (e) {}
      })();
    </script>

  <body>
    <!-- Boot splash: painted straight from HTML so the trampoline bounce starts
         the moment the page renders — long before the React bundle downloads
         and boots (on a cold PWA launch the static iOS launch image used to sit
         frozen for ~1s while the app loaded). Styles are self-contained because
         index.css is not loaded yet at this point. React's <SplashScreen> does
         NOT render its own copy — it only times the fade-out and removes this
         node, so it is the same DOM the whole time and there is no handoff snap
         mid-bounce.
         Loading phase (user request): the /splash/launch-*.png images are now
         PLAIN solid dark (#050505) and this overlay first shows only a spinner
         (#boot-splash-loader); the icon+title content stays hidden until the
         display fonts are actually loaded (the icon is inline SVG; inline script
         adds .ready, 2.5s safety timeout). Black + loading circle on every
         device until the real splash can render — no static/live content
         matching, so there is nothing to visually "stick" or jump. -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(ellipse 70% 45% at 15% -5%,hsl(199 95.5% 73.9% / .07) 0%,transparent 60%),
                   radial-gradient(ellipse 50% 40% at 90% 0%,hsl(234 89.5% 73.9% / .05) 0%,transparent 55%),
                   hsl(0 0% 2%)}
      html:not(.dark) #boot-splash{
        background:radial-gradient(ellipse 70% 45% at 15% -5%,hsl(200 98% 39.4% / .10) 0%,transparent 60%),
                   radial-gradient(ellipse 50% 40% at 90% 0%,hsl(239 83.5% 66.7% / .07) 0%,transparent 55%),
                   hsl(0 0% 100%)}
      #boot-splash-loader{position:absolute;left:50%;top:50%;width:2.25rem;height:2.25rem;margin:-1.125rem 0 0 -1.125rem;
        border-radius:9999px;border:3px solid hsl(199 95.5% 73.9% / .2);border-top-color:hsl(199 95.5% 73.9%);
        animation:boot-spin .8s linear infinite}
      html:not(.dark) #boot-splash-loader{border-color:hsl(200 98% 39.4% / .2);border-top-color:hsl(200 98% 39.4%)}
      #boot-splash.ready #boot-splash-loader{display:none}
      #boot-splash-group{display:flex;flex-direction:column;align-items:center;gap:1.5rem;visibility:hidden}
      #boot-splash.ready #boot-splash-group{visibility:visible}
      #boot-splash-stage{position:relative;display:flex;justify-content:center;width:9rem;height:7.6rem}
      #boot-splash.ready #boot-splash-stage{animation:boot-pop .5s cubic-bezier(.23,1,.32,1) both}
      #boot-splash-glow{position:absolute;left:50%;top:2.6rem;width:17rem;height:17rem;margin:-8.5rem 0 0 -8.5rem;
        border-radius:9999px;pointer-events:none;
        background:radial-gradient(circle,hsl(199 95.5% 73.9% / .13) 0%,transparent 62%)}
      html:not(.dark) #boot-splash-glow{background:radial-gradient(circle,hsl(200 98% 39.4% / .08) 0%,transparent 62%)}
      #boot-splash-icon{position:relative;display:block;width:6rem;height:6rem;border-radius:1.5rem;overflow:hidden;-webkit-user-select:none;user-select:none;
        box-shadow:0 0 0 1px hsl(0 0% 100% / .1),0 8px 20px -8px hsl(199 95.5% 73.9% / .35),0 25px 50px -12px hsl(199 95.5% 73.9% / .25);
        transform-origin:center bottom}
      #boot-splash.ready #boot-splash-icon{animation:boot-splash-bounce .7s infinite}
      html:not(.dark) #boot-splash-icon{box-shadow:0 0 0 1px hsl(0 0% 0% / .05),0 25px 50px -12px hsl(200 98% 39.4% / .25)}
      #boot-splash-ground{position:absolute;bottom:0;left:50%;width:4.9rem;height:.8rem;margin-left:-2.45rem;
        border-radius:9999px;filter:blur(3px);
        background:radial-gradient(50% 50% at 50% 50%,hsl(199 95.5% 73.9% / .3) 0%,transparent 72%);
        }
      #boot-splash.ready #boot-splash-ground{animation:boot-ground .7s infinite}
      /* App icon graph, drawn one point per bounce (5 bounces = one loop):
         bounces 1-4 each draw the next line piece in the air and pop the next
         dot, bounce 5 holds the full graph, then it fades and starts again. */
      #boot-splash-icon .bs-line{stroke-dasharray:100;stroke-dashoffset:100}
      #boot-splash-icon .bs-dot{transform-box:fill-box;transform-origin:center;opacity:0}
      #boot-splash-icon .bs-dot0{opacity:1}
      #boot-splash.ready #boot-splash-icon .bs-graph{animation:bs-graph 3.5s linear infinite}
      #boot-splash.ready #boot-splash-icon .bs-line{animation:bs-line 3.5s linear infinite}
      #boot-splash.ready #boot-splash-icon .bs-dot1{animation:bs-dot1 3.5s linear infinite}
      #boot-splash.ready #boot-splash-icon .bs-dot2{animation:bs-dot2 3.5s linear infinite}
      #boot-splash.ready #boot-splash-icon .bs-dot3{animation:bs-dot3 3.5s linear infinite}
      #boot-splash.ready #boot-splash-icon .bs-dot4{animation:bs-dot4 3.5s linear infinite}
      @keyframes bs-line{0%{stroke-dashoffset:100}1.0%{stroke-dashoffset:100;animation-timing-function:cubic-bezier(.33,1,.68,1)}11.0%{stroke-dashoffset:76.02}21.0%{stroke-dashoffset:76.02;animation-timing-function:cubic-bezier(.33,1,.68,1)}31.0%{stroke-dashoffset:57.13}41.0%{stroke-dashoffset:57.13;animation-timing-function:cubic-bezier(.33,1,.68,1)}51.0%{stroke-dashoffset:23.98}61.0%{stroke-dashoffset:23.98;animation-timing-function:cubic-bezier(.33,1,.68,1)}71.0%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
      @keyframes bs-dot1{0%,10.0%{opacity:0;transform:scale(.4)}13.6%,100%{opacity:1;transform:scale(1)}}
      @keyframes bs-dot2{0%,30.0%{opacity:0;transform:scale(.4)}33.6%,100%{opacity:1;transform:scale(1)}}
      @keyframes bs-dot3{0%,50.0%{opacity:0;transform:scale(.4)}53.6%,100%{opacity:1;transform:scale(1)}}
      @keyframes bs-dot4{0%,70.0%{opacity:0;transform:scale(.4)}73.6%,100%{opacity:1;transform:scale(1)}}
      @keyframes bs-graph{0%,92%{opacity:1}99%,100%{opacity:0}}
      html:not(.dark) #boot-splash-ground{background:radial-gradient(50% 50% at 50% 50%,hsl(210 30% 10% / .22) 0%,transparent 72%)}
      #boot-splash-text{display:flex;flex-direction:column;align-items:center;gap:.7rem}
      #boot-splash.ready #boot-splash-text{animation:boot-fade-in-up .45s cubic-bezier(.23,1,.32,1) .07s both}
      #boot-splash-title{margin:0;font-family:'Inter',sans-serif;font-weight:800;font-size:clamp(2.15rem,9vw,2.6rem);line-height:1.02;
        letter-spacing:-0.035em;color:hsl(180 6.7% 97.1%)}
      html:not(.dark) #boot-splash-title{color:hsl(210 33.3% 5.9%)}
      #boot-splash-title span{padding:.1em .08em;margin:-.1em -.08em;
        background:linear-gradient(135deg,#3B5BFF 0%,#00B4E6 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
      #boot-splash-tagline{margin:0;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;
        letter-spacing:.22em;text-transform:uppercase;color:hsl(216 6.9% 57.5% / .7);
        font-feature-settings:"liga" 0,"calt" 0;font-variant-ligatures:none}
      html:not(.dark) #boot-splash-tagline{color:hsl(211 11.1% 44.1% / .75)}
      #boot-splash-tagline .bs-dot{color:hsl(217 91% 60% / .9);margin:0 .1em}
      html:not(.dark) #boot-splash-tagline .bs-dot{color:hsl(221 83% 53% / .8)}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
      @keyframes boot-fade-in-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes boot-splash-bounce{
        0%,100%{transform:translateY(0) scaleX(1) scaleY(1);animation-timing-function:cubic-bezier(.33,0,.4,1)}
        45%{transform:translateY(-26px) scaleX(.97) scaleY(1.03);animation-timing-function:cubic-bezier(.6,0,.67,1)}
        90%{transform:translateY(0) scaleX(1.05) scaleY(.95)}}
      @keyframes boot-ground{
        0%,100%{transform:scaleX(1.05);opacity:.95;animation-timing-function:cubic-bezier(.33,0,.4,1)}
        45%{transform:scaleX(.66);opacity:.45;animation-timing-function:cubic-bezier(.6,0,.67,1)}
        90%{transform:scaleX(1.16);opacity:1}}
      @media (prefers-reduced-motion:reduce){
        #boot-splash.ready #boot-splash-icon,#boot-splash.ready #boot-splash-ground,
        #boot-splash.ready #boot-splash-icon *{animation:none}
        #boot-splash-icon .bs-line{stroke-dashoffset:0}
        #boot-splash-icon .bs-dot{opacity:1}
        #boot-splash-ground{opacity:.8}
        #boot-splash.ready #boot-splash-stage,#boot-splash.ready #boot-splash-text{animation:none}}
    </style>
    <div id="boot-splash" data-testid="splash-screen" aria-hidden="true">
      <div id="boot-splash-loader"></div>
      <div id="boot-splash-group">
        <div id="boot-splash-stage">
          <div id="boot-splash-glow"></div>
          <svg id="boot-splash-icon" viewBox="0 0 1024 1024" aria-hidden="true">
            <defs><linearGradient id="bs-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5BFF"/><stop offset="1" stop-color="#00B4E6"/></linearGradient></defs>
            <rect width="1024" height="1024" fill="url(#bs-bg)"/>
            <rect x="250" y="150" width="524" height="724" rx="64" fill="#fff"/>
            <path d="M318 240H706M318 300H706" stroke="#D1D1D6" stroke-width="20" stroke-linecap="round"/>
            <path d="M314 770H710" stroke="#1C1C1E" stroke-width="26" stroke-linecap="round"/>
            <g class="bs-graph" fill="#4A78F2" stroke="#fff" stroke-width="12">
              <polyline class="bs-line" pathLength="100" points="340,690 430,610 520,640 610,500 690,410" fill="none" stroke="#4A78F2" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
              <circle class="bs-dot bs-dot0" cx="340" cy="690" r="22"/>
              <circle class="bs-dot bs-dot1" cx="430" cy="610" r="22"/>
              <circle class="bs-dot bs-dot2" cx="520" cy="640" r="22"/>
              <circle class="bs-dot bs-dot3" cx="610" cy="500" r="22"/>
              <circle class="bs-dot bs-dot4" cx="690" cy="410" r="32"/>
            </g>
          </svg>
          <div id="boot-splash-ground"></div>
        </div>
        <div id="boot-splash-text">
          <h1 id="boot-splash-title">Trampoline <span>Note</span></h1>
          <p id="boot-splash-tagline">Jump <span class="bs-dot">·</span> Log <span class="bs-dot">·</span> Progress</p>
        </div>
      </div>
    </div>
    <!-- Splash loading gate, runs during parse (all devices): keep the spinner
         until the display fonts are actually loaded (the icon is inline SVG), then
         add .ready to swap spinner → animated splash content. 2.5s safety
         timeout so a stalled asset can never hold the spinner forever, and a
         15s dead-man fade in case the app bundle itself never boots. -->
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        if (!splash) return;
        var revealed = false;
        function reveal() {
          if (revealed) return;
          revealed = true;
          splash.classList.add("ready");
          // SplashScreen keeps the splash up until the first graph is drawn.
          window.__bootSplashReadyAt = performance.now();
        }
        var fontsDone = false;
        function check() { if (fontsDone) reveal(); }
        if (document.fonts && document.fonts.load) {
          var fontsOk = function () { fontsDone = true; check(); };
          Promise.all([
            document.fonts.load("800 1em 'Inter'"),
            document.fonts.load("500 1em 'Inter'"),
          ]).then(fontsOk, fontsOk);
        } else {
          fontsDone = true;
        }
        check();
        setTimeout(reveal, 2500);
        // Dead-man fallback: if the app bundle never boots (network failure,
        // crash before mount), don't spin/bounce forever — self-fade after 15s.
        // Harmless no-op when React has already removed the node.
        setTimeout(function () {
          if (!document.getElementById("boot-splash")) return;
          splash.style.transition = "opacity .5s ease-out";
          splash.style.opacity = "0";
          splash.style.pointerEvents = "none";
          setTimeout(function () { splash.remove(); }, 500);
        }, 15000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
