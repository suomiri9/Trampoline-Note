kind = "web"
previewPath = "/dictionary-admin/"
title = "Dictionary Admin"
description = "Developer-only authoring workspace for the Trampoline skills dictionary, including owner-protected entry management, suggestion review, and private approved pose-sequence illustrations."
version = "1.0.0"
id = "artifacts/dictionary-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/dictionary-admin/" ]
localPort = 20652

[services.development]
run = "pnpm --filter @workspace/dictionary-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dictionary-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/dictionary-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20652"
BASE_PATH = "/dictionary-admin/"
