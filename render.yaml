# Render Blueprint: one web service that serves the web app (/), the
# dictionary admin (/dictionary-admin/) and the API (/api).
# In Render: New > Blueprint > pick this repo. Fill in the "sync: false" values when asked.
# pnpm is installed into $HOME because Render's /usr/bin is read-only (corepack enable fails).
services:
  - type: web
    name: trampoline-note
    runtime: node
    plan: starter
    region: oregon
    buildCommand: >-
      npm install -g --prefix "$HOME/.pnpm-cli" pnpm@10.28.0 &&
      export PATH="$HOME/.pnpm-cli/bin:$PATH" &&
      pnpm install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/trampoline run build &&
      PORT=3000 BASE_PATH=/dictionary-admin/ pnpm --filter @workspace/dictionary-admin run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: APP_BASE_URL
        value: https://trampolinenote.com
      # Where the iOS app reaches the API (see trampoline/src/lib/native-app.ts).
      - key: APP_API_ORIGIN
        value: https://trampoline-note.onrender.com
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Model for the AI coach. Change it here or in Render's Environment tab.
      - key: COACH_MODEL
        value: gpt-4.1
      - key: RESEND_API_KEY
        sync: false
      - key: WHOOP_CLIENT_ID
        sync: false
      - key: WHOOP_CLIENT_SECRET
        sync: false
      - key: RESET_EMAIL_FROM
        sync: false
